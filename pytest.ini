[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/html/report.html
    --self-contained-html
    --alluredir=reports/allure

markers =
    smoke: fast, high-value tests suitable for a pre-merge smoke suite
    regression: full regression coverage
    slow: tests that are expected to take noticeably longer (e.g. performance_glitch_user)
    negative: negative / invalid-input test scenarios

filterwarnings =
    ignore::DeprecationWarning

log_cli = false
