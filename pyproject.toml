[project]
name = "playwright-python-framework"
version = "1.0.0"
description = "Enterprise-grade Playwright + Pytest automation framework for saucedemo.com"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["reports", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pages", "utilities", "config", "fixtures", "tests"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["reports/", "build/"]
