# config.yaml
#
# Default framework configuration. Every value here can be overridden by an
# environment variable of the same (upper-cased) name -- see config/config_manager.py.
# The active environment block is selected via the ENV environment variable
# (defaults to 'qa').

environment: qa

browser: chromium
headless: true
timeout: 30000
navigation_timeout: 30000
retry_count: 2
slow_mo: 0
viewport_width: 1920
viewport_height: 1080

screenshot_on_failure: true
video_mode: retain-on-failure     # off | on | retain-on-failure
trace_mode: retain-on-failure     # off | on | retain-on-failure

log_level: INFO

environments:
  qa:
    base_url: "https://www.saucedemo.com"
  staging:
    base_url: "https://www.saucedemo.com"
  prod:
    base_url: "https://www.saucedemo.com"
